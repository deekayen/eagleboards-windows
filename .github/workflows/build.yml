name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check-in pages match eagleboards-shared (SPEC.md D-18)
        shell: bash
        # The check-in pages are designed once, in eagleboards-shared/checkin,
        # and every version serves them unchanged. checkin-pages.lock pins the
        # commit; a copy edited here instead of there fails the build. CRs are
        # stripped first: this checkout may have converted line endings.
        run: |
          SHA=$(tr -d '[:space:]' < checkin-pages.lock)
          for f in index.html youth_register.html adult_register.html checkin.css checkin.js; do
            curl -sfL --retry 3 "https://raw.githubusercontent.com/deekayen/eagleboards-shared/$SHA/checkin/$f" -o "shared-$f" \
              || { echo "FAIL: could not fetch checkin/$f at eagleboards-shared@$SHA"; exit 1; }
            if ! cmp -s <(tr -d '\r' < "shared-$f") <(tr -d '\r' < "src/EagleBoards.Web/wwwroot/$f"); then
              echo "FAIL: wwwroot/$f differs from eagleboards-shared@$SHA."
              echo "      Edit it in eagleboards-shared/checkin, copy all five files here, and update checkin-pages.lock."
              exit 1
            fi
          done
          echo "check-in pages match eagleboards-shared@$SHA"
      - name: Rule and auto-select cases match eagleboards-shared (SPEC.md D-5)
        shell: bash
        # The cases are written once, in eagleboards-shared/cases, and every
        # version runs all of them (SharedCaseTests). test-cases.lock pins the
        # commit; a case edited, added or dropped here instead of there fails
        # the build. The whole folder is fetched, so a case added there and
        # not copied here is caught too. CRs are stripped, as for the pages.
        run: |
          SHA=$(tr -d '[:space:]' < test-cases.lock)
          ours=tests/EagleBoards.Tests/cases
          mkdir shared-cases
          curl -sfL --retry 3 "https://codeload.github.com/deekayen/eagleboards-shared/tar.gz/$SHA" -o shared-cases.tar.gz \
            || { echo "FAIL: could not fetch eagleboards-shared@$SHA"; exit 1; }
          tar -xzf shared-cases.tar.gz -C shared-cases --strip-components=1
          (cd shared-cases/cases && ls *.json) > shared-cases.txt
          (cd "$ours" && ls *.json) > our-cases.txt
          if ! cmp -s shared-cases.txt our-cases.txt; then
            echo "FAIL: $ours does not hold the same files as eagleboards-shared@$SHA/cases:"
            diff shared-cases.txt our-cases.txt || true
            exit 1
          fi
          while read -r f; do
            if ! cmp -s <(tr -d '\r' < "shared-cases/cases/$f") <(tr -d '\r' < "$ours/$f"); then
              echo "FAIL: $ours/$f differs from eagleboards-shared@$SHA."
              echo "      Change it in eagleboards-shared/cases, copy the *.json here, and update test-cases.lock."
              exit 1
            fi
          done < shared-cases.txt
          echo "rule and auto-select cases match eagleboards-shared@$SHA ($(wc -l < shared-cases.txt | tr -d ' ') files)"
      - name: Build
        run: dotnet build EagleBoards.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/EagleBoards.Tests -c Release --no-build

      # The operator window, driven off-screen over synthetic data: a proposed
      # board following sign-ins, a choice cell opening on one click.
      - name: Window tests
        run: dotnet test tests/EagleBoards.UiTests -c Release --no-build

      # The Java project's end-to-end event test, unchanged apart from how the
      # server is launched: the proof that the port's server behaves the same.
      - name: Board event (HTTP, end to end)
        shell: bash
        run: bash scripts/test-board-event.sh

      # Off-screen renders of every window over synthetic data, light and
      # dark, plus the social preview, for review.
      - name: UI snapshots
        continue-on-error: true
        shell: bash
        run: |
          dotnet run --project tests/EagleBoards.UiSnapshots -c Release --no-build -- snapshots/light
          dotnet run --project tests/EagleBoards.UiSnapshots -c Release --no-build -- snapshots/dark --dark
          dotnet run --project tests/EagleBoards.UiSnapshots -c Release --no-build -- --demo snapshots/demo

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-snapshots
          path: snapshots/
          if-no-files-found: ignore

      # A build of main, not a release: the version says which run made it.
      # Releases come from release.yml.
      - name: Publish the app (one self-contained exe)
        shell: bash
        run: |
          VERSION="$(date -u +%Y.%m.%d)-ci.${{ github.run_number }}"
          dotnet publish src/EagleBoards.App -c Release -r win-x64 -p:Version="$VERSION" -o publish
          ls -la publish

      - name: Smoke test the published exe
        shell: bash
        run: bash scripts/smoke-test-exe.sh publish/EagleBoards.exe

      - uses: actions/upload-artifact@v7
        with:
          name: EagleBoards-win-x64
          path: publish/EagleBoards.exe
