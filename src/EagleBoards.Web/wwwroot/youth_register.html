<!DOCTYPE html>
<html>
   <head>
      <title>Youth Sign-In</title>
      <meta charset="UTF-8">
      <!-- See index.html: without this the page is laid out at a notional
           980px on a phone and then scaled down, and the CSS below never sees
           the real screen width. -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" type="text/css" href="scheduler.css"/>
      <script src="/eb-data.js"></script>
      <!-- Form layout and type scale live in eb-ui.css, shared by both
           registration pages so they cannot drift apart. The rules that were
           here described the old two-column, right-aligned-label layout and a
           fixed 640px width; all three are gone. -->
      <link rel="stylesheet" type="text/css" href="eb-ui.css"/>
   </head>
   <body class="eb-public" style="background-color: #ffffff;">
      <!-- Class rather than an inline padding-top, so the stylesheet can
           compress this block on a short screen instead of being outranked
           by the inline style. -->
      <div class="reg-head">
         <span class="page-subheader">Youth Sign-In</span>
      </div>

      <!-- Single column with top-aligned labels. Baymard's form research finds
           multi-column layouts draw attention in several directions at once, so
           people skip required fields; and Penzo's eye-tracking (replicated by
           Wroblewski) found top-aligned labels are completed markedly faster,
           because the label and its field land in one fixation instead of a
           horizontal scan. The only pairs kept side by side are the ones that
           read as a single item -- a name, and a unit -- which is the documented
           exception. Field widths hint at the expected input length. -->
      <div class="reg-wrap">
         <form id="regForm" autocomplete="off">
            <fieldset>
               <legend>Youth Registration</legend>

               <div class="reg-field">
                  <label for="Email">Email</label>
                  <!-- Deliberately type="text", not type="email": the title
                       below documents NONE as a legal value, and type="email"
                       would reject it. inputmode still gets the @ keyboard on
                       a tablet, and turning off autocapitalise/spellcheck
                       stops a touch keyboard offering "Bob@" or underlining
                       the address in red. -->
                  <input type="text" id="Email" name="Email" list="emailOptions" required
                         inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
                         title="Enter Email. If none, enter NONE.">
                  <datalist id="emailOptions"></datalist>
               </div>
               <input type="hidden" name="ID" value="">

               <div class="reg-pair">
                  <div class="reg-field">
                     <label for="First">First name</label>
                     <input type="text" id="First" name="First" required>
                  </div>
                  <div class="reg-field">
                     <label for="Last">Last name</label>
                     <input type="text" id="Last" name="Last" required>
                  </div>
               </div>

               <div class="reg-pair">
                  <div class="reg-field">
                     <label for="Phone">Phone</label>
                     <!-- type=tel raises the phone keypad instead of the full
                          keyboard. It intentionally does not constrain what
                          may be typed: 555-1234, (555) 1234 and 5551234 are
                          all accepted, because a rejected phone number at a
                          check-in table costs more than an inconsistent one. -->
                     <input type="tel" id="Phone" name="Phone" required inputmode="tel">
                  </div>
                  <div class="reg-field">
                     <label for="DOB">Birthdate</label>
                     <!-- Left as free text on purpose. type="date" would force
                          the browser's ISO value format on a column that no
                          Java code parses -- DOB is stored, listed and
                          exported as an opaque string -- so it would silently
                          change the shape of the data next to every record
                          already on file. A picker is also the wrong control
                          for a birth year 15+ years back: it opens on the
                          current month and has to be paged. -->
                     <input type="text" id="DOB" name="DOB" required>
                  </div>
               </div>

               <div class="reg-pair">
                  <div class="reg-field reg-grow">
                     <label for="UnitType">Unit type</label>
                     <select id="UnitType" name="UnitType" required>
                        <option value="Troop">Troop</option>
                        <option value="Post">Post</option>
                        <option value="Crew">Crew</option>
                        <option value="Ship">Ship</option>
                     </select>
                  </div>
                  <div class="reg-field reg-narrow">
                     <label for="Unit">Unit #</label>
                     <input type="text" id="Unit" name="Unit" required pattern="[0-9]+"
                            title="Unit # must be a whole number.">
                  </div>
               </div>
            </fieldset>

            <fieldset>
               <legend>Board information</legend>
               <div class="reg-field">
                  <label for="BoardType">Board type</label>
                  <!-- Labels only. The submitted values stay "Final" and
                       "Project": they are the stored BoardType, and they key the
                       room assignments and the Project*/Final* warning timers in
                       config.properties. -->
                  <select id="BoardType" name="BoardType">
                     <option value="Final">Final Board</option>
                     <option value="Project">Proposal Review</option>
                  </select>
               </div>
               <div class="reg-field">
                  <label for="Leader">Leader name</label>
                  <input type="text" id="Leader" name="Leader">
               </div>
            </fieldset>
            <div id="statusMsg"></div>
            <div class="reg-buttons">
               <button type="submit" id="registerBtn" class="register_button"><b>Register</b></button>
               <button type="button" id="cancelBtn"><b>Cancel</b></button>
            </div>
         </form>
      </div>

      <script>
         var form = document.getElementById("regForm");
         var statusMsg = document.getElementById("statusMsg");

         // Populate the Email autofill suggestions.
         ebAutofillList("/youth-autofill").then(function (options) {
            var datalist = document.getElementById("emailOptions");
            options.forEach(function (value) {
               var opt = document.createElement("option");
               opt.value = value;
               datalist.appendChild(opt);
            });
         });

         // When a known email is entered, prefill the rest of the form.
         var last_email = "";
         var PREFILL = ["ID", "Last", "First", "Phone", "DOB", "UnitType", "Unit", "BoardType", "Leader"];
         function onEmailChange() {
            var value = form.elements["Email"].value;
            if (value && last_email !== value && value != "NONE" && value != "none") {
               form.elements["ID"].value = "";
               last_email = value;
               ebAutofillRecord("/youth-autofill", "Email", value).then(function (rec) {
                  if (!rec) {
                     return;
                  }
                  PREFILL.forEach(function (name) {
                     if (rec[name] != null && form.elements[name]) {
                        form.elements[name].value = rec[name];
                     }
                  });
               });
            }
         }
         form.elements["Email"].addEventListener("change", onEmailChange);
         form.elements["Email"].addEventListener("input", onEmailChange);

         function setStatus(text, cls) {
            statusMsg.textContent = text;
            statusMsg.className = cls;
         }

         form.addEventListener("submit", function (ev) {
            ev.preventDefault();
            var fields = {};
            ["Email", "ID", "Last", "First", "Phone", "DOB", "UnitType", "Unit", "BoardType", "Leader"].forEach(function (name) {
               fields[name] = form.elements[name].value;
            });
            var btn = document.getElementById("registerBtn");
            btn.disabled = true;
            setStatus("Registering...", "");
            fetch("/register-youth", {
               method: "POST",
               headers: { "Content-Type": "application/x-www-form-urlencoded" },
               body: ebFormBody(fields)
            }).then(function (r) {
               return r.text().then(function (text) { return { status: r.status, text: text }; });
            }).then(function (res) {
               if (res.status === 200) {
                  setStatus("Registration complete. Thank you!", "ok");
                  setTimeout(function () { window.location.href = "/"; }, 1200);
               } else {
                  btn.disabled = false;
                  setStatus(res.text || "Registration failed. Please try again.", "err");
               }
            }).catch(function () {
               btn.disabled = false;
               setStatus("Registration failed. Please try again.", "err");
            });
         });

         document.getElementById("cancelBtn").addEventListener("click", function () {
            if (window.confirm("Are you sure you want to Cancel ?")) {
               window.location.href = "/";
            }
         });
      </script>
   </body>
</html>
