<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="color-scheme" content="light dark">
      <title>Sign in: Eagle Boards</title>
      <link rel="stylesheet" href="checkin.css">
      <script src="checkin.js"></script>
   </head>
   <!-- The page the tablets at the door open on, shared by every version of
        Eagle Boards (eagleboards-shared/checkin). Edit it there, not in a
        version's copy. -->
   <body>
      <main class="page welcome">
         <h1>Welcome to Eagle Boards</h1>
         <p class="lead">Please sign in</p>

         <!-- Links, not buttons: each goes to another page. Tapping "I am 21
              or older" is how an adult attests their age. -->
         <nav class="choices" aria-label="Sign in as">
            <a class="choice primary" href="/youth_register">
               <span class="choice-title">I am a youth</span>
               <span class="choice-detail">Here for my board of review or project review</span>
            </a>
            <a class="choice" href="/adult_register">
               <span class="choice-title">I am 21 or older</span>
               <span class="choice-detail">A board member, leader or parent</span>
            </a>
         </nav>

         <h2 class="lists-heading">Already signed in</h2>
         <div class="lists">
            <section class="card" aria-labelledby="youthHeading">
               <div class="card-head">
                  <h3 id="youthHeading">Youth (<span id="youthCount">0</span>)</h3>
               </div>
               <div class="list-scroll" role="region" tabindex="0" aria-labelledby="youthHeading">
                  <table id="youthTable" hidden>
                     <thead><tr><th scope="col">Time</th><th scope="col">Name</th><th scope="col">Unit</th></tr></thead>
                     <tbody></tbody>
                  </table>
                  <p class="empty">No one yet.</p>
               </div>
            </section>
            <section class="card" aria-labelledby="adultHeading">
               <div class="card-head">
                  <h3 id="adultHeading">Adults (<span id="adultCount">0</span>)</h3>
               </div>
               <div class="list-scroll" role="region" tabindex="0" aria-labelledby="adultHeading">
                  <table id="adultTable" hidden>
                     <thead><tr><th scope="col">Name</th><th scope="col">Unit</th></tr></thead>
                     <tbody></tbody>
                  </table>
                  <p class="empty">No one yet.</p>
               </div>
            </section>
         </div>
      </main>
      <script>
         ebWelcomeLists();
      </script>
   </body>
</html>
