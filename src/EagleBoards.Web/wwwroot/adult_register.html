<!DOCTYPE html>
<html>
   <head>
      <title>Adult Sign-In</title>
      <meta charset="UTF-8">
      <!-- See index.html: without this the page is laid out at a notional
           980px on a phone and then scaled down, and the CSS below never sees
           the real screen width. -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" type="text/css" href="scheduler.css"/>
      <script src="/eb-data.js"></script>
      <!-- Form layout and type scale live in eb-ui.css, shared by both
           registration pages so they cannot drift apart. The rules that were
           here described the old two-column, right-aligned-label layout and a
           fixed 640px width; all three are gone. -->
      <link rel="stylesheet" type="text/css" href="eb-ui.css"/>
   </head>
   <body class="eb-public" style="background-color: #ffffff;">
      <!-- Class rather than an inline padding-top, so the stylesheet can
           compress this block on a short screen instead of being outranked
           by the inline style. -->
      <div class="reg-head">
         <span class="page-subheader">Adult Sign-In</span>
      </div>

      <!-- Same single-column, top-label structure as the youth form; see the
           note there for the research behind it. Only name and unit stay paired,
           being the documented single-conceptual-unit exception. -->
      <div class="reg-wrap">
         <form id="regForm" autocomplete="off">
            <fieldset>
               <legend>Adult registration</legend>

               <div class="reg-field">
                  <label for="Email">Email</label>
                  <!-- Deliberately type="text", not type="email": the title
                       below documents NONE as a legal value, and type="email"
                       would reject it. inputmode still gets the @ keyboard on
                       a tablet, and turning off autocapitalise/spellcheck
                       stops a touch keyboard offering "Bob@" or underlining
                       the address in red. -->
                  <input type="text" id="Email" name="Email" list="emailOptions" required
                         inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
                         title="Enter Email. If none, enter NONE.">
                  <datalist id="emailOptions"></datalist>
               </div>
               <input type="hidden" name="ID" value="">

               <div class="reg-pair">
                  <div class="reg-field">
                     <label for="First">First name</label>
                     <input type="text" id="First" name="First" required>
                  </div>
                  <div class="reg-field">
                     <label for="Last">Last name</label>
                     <input type="text" id="Last" name="Last" required>
                  </div>
               </div>

               <div class="reg-field">
                  <label for="Phone">Phone</label>
                  <!-- type=tel raises the phone keypad instead of the full
                       keyboard. It intentionally does not constrain what may
                       be typed: 555-1234, (555) 1234 and 5551234 are all
                       accepted, because a rejected phone number at a check-in
                       table costs more than an inconsistent one. -->
                  <input type="tel" id="Phone" name="Phone" required inputmode="tel">
               </div>

               <div class="reg-pair">
                  <div class="reg-field reg-grow">
                     <label for="UnitType">Unit type</label>
                     <select id="UnitType" name="UnitType" required>
                        <option value="Troop">Troop</option>
                        <option value="Post">Post</option>
                        <option value="Crew">Crew</option>
                        <option value="Ship">Ship</option>
                        <option value="Pack">Pack</option>
                        <!-- Adults can serve from a district, council or
                             community role rather than a numbered unit. The
                             script below disables Unit # for these three. -->
                        <option value="District">District</option>
                        <option value="Council">Council</option>
                        <option value="Community">Community</option>
                     </select>
                  </div>
                  <div class="reg-field reg-narrow" id="unitField">
                     <label for="Unit">Unit #</label>
                     <input type="text" id="Unit" name="Unit" required pattern="[0-9]+"
                            inputmode="numeric" title="Unit # must be a whole number.">
                  </div>
               </div>
            </fieldset>

            <fieldset>
               <legend>I can serve as</legend>
               <div class="reg-pair">
                  <div class="reg-field">
                     <label for="FinalBoard">Final Board</label>
                     <select id="FinalBoard" name="FinalBoard" required>
                        <option value="Member">Member</option>
                        <option value="Chair">Chair</option>
                     </select>
                  </div>
                  <div class="reg-field">
                     <label for="ProjectReview">Proposal Review</label>
                     <select id="ProjectReview" name="ProjectReview" required>
                        <option value="Member">Member</option>
                        <option value="Chair">Chair</option>
                     </select>
                  </div>
               </div>
            </fieldset>
            <div id="statusMsg"></div>
            <div class="reg-buttons">
               <button type="submit" id="registerBtn" class="register_button"><b>Register</b></button>
               <button type="button" id="cancelBtn"><b>Cancel</b></button>
            </div>
         </form>
      </div>

      <script>
         var form = document.getElementById("regForm");
         var statusMsg = document.getElementById("statusMsg");

         // Populate the Email autofill suggestions.
         ebAutofillList("/adult-autofill").then(function (options) {
            var datalist = document.getElementById("emailOptions");
            options.forEach(function (value) {
               var opt = document.createElement("option");
               opt.value = value;
               datalist.appendChild(opt);
            });
         });

         // Unit types that are a role rather than a numbered unit. Someone
         // serving from a district, council or community position has no unit
         // number, so the box is disabled and cleared rather than left to be
         // filled in with a placeholder like 0 or N/A that would then have to
         // be interpreted by whoever reads the report.
         var UNITLESS_TYPES = ["District", "Council", "Community"];
         var unitField = document.getElementById("unitField");

         function syncUnitField() {
            var unitless = UNITLESS_TYPES.indexOf(form.elements["UnitType"].value) >= 0;
            var unit = form.elements["Unit"];
            if (unitless) {
               unit.value = "";
            }
            // Both matter. `disabled` greys it out and takes it out of the tab
            // order; dropping `required` is what stops the browser refusing to
            // submit a form whose empty box the person was never allowed to
            // fill in. The submit handler reads .value directly rather than
            // relying on native form encoding, so the cleared value is still
            // what gets sent.
            unit.disabled = unitless;
            unit.required = !unitless;
            unitField.className = unitless ? "reg-field reg-narrow is-disabled" : "reg-field reg-narrow";
         }
         form.elements["UnitType"].addEventListener("change", syncUnitField);
         syncUnitField();

         // When a known email is entered, prefill the rest of the form.
         var last_email = "";
         var PREFILL = ["ID", "Last", "First", "Phone", "UnitType", "Unit", "FinalBoard", "ProjectReview"];
         function onEmailChange() {
            var value = form.elements["Email"].value;
            if (value && last_email !== value && value != "NONE" && value != "none") {
               form.elements["ID"].value = "";
               last_email = value;
               ebAutofillRecord("/adult-autofill", "Email", value).then(function (rec) {
                  if (!rec) {
                     return;
                  }
                  PREFILL.forEach(function (name) {
                     if (rec[name] != null && form.elements[name]) {
                        form.elements[name].value = rec[name];
                     }
                  });
                  // A returning district volunteer prefills UnitType=District,
                  // so the Unit box has to follow the restored value, not the
                  // one that was showing before the lookup.
                  syncUnitField();
               });
            }
         }
         form.elements["Email"].addEventListener("change", onEmailChange);
         form.elements["Email"].addEventListener("input", onEmailChange);

         function setStatus(text, cls) {
            statusMsg.textContent = text;
            statusMsg.className = cls;
         }

         form.addEventListener("submit", function (ev) {
            ev.preventDefault();
            var fields = {};
            ["Email", "ID", "Last", "First", "Phone", "UnitType", "Unit", "FinalBoard", "ProjectReview"].forEach(function (name) {
               fields[name] = form.elements[name].value;
            });
            var btn = document.getElementById("registerBtn");
            btn.disabled = true;
            setStatus("Registering...", "");
            fetch("/register-adult", {
               method: "POST",
               headers: { "Content-Type": "application/x-www-form-urlencoded" },
               body: ebFormBody(fields)
            }).then(function (r) {
               return r.text().then(function (text) { return { status: r.status, text: text }; });
            }).then(function (res) {
               if (res.status === 200) {
                  setStatus("Registration complete. Thank you!", "ok");
                  setTimeout(function () { window.location.href = "/"; }, 1200);
               } else {
                  btn.disabled = false;
                  setStatus(res.text || "Registration failed. Please try again.", "err");
               }
            }).catch(function () {
               btn.disabled = false;
               setStatus("Registration failed. Please try again.", "err");
            });
         });

         document.getElementById("cancelBtn").addEventListener("click", function () {
            if (window.confirm("Are you sure you want to Cancel ?")) {
               window.location.href = "/";
            }
         });
      </script>
   </body>
</html>
